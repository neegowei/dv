server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: apps
          __path__: /var/log/apps/*/*.log
    pipeline_stages:
      - regex:
          expression: ".*/(?P<service>[^/]+)/(?P<level>[^/.]+)\\.log"
          source: filename
      - labels:
          service:
          level:
      - json:
          expressions:
            content: content
            caller: caller
            timestamp: '"@timestamp"'

  - job_name: host_syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/host/syslog
