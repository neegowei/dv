name: ${DB_PROJECT_NAME:-shared-db}

networks:
  internal:
    name: ${DB_NETWORK:-shared_db}
    external: true

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8}
    restart: unless-stopped
    env_file:
      - ./.env.db
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
    volumes:
      - ${MYSQL_DATA_DIR:-/data/mysql}:/var/lib/mysql
    networks:
      - internal

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    env_file:
      - ./.env.db
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    command: redis-server --requirepass ${REDIS_PASS:-redis_pass}
    volumes:
      - ${REDIS_DATA_DIR:-/data/redis}:/data
    networks:
      - internal

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    env_file:
      - ./.env.db
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_pass}
    volumes:
      - ${MONGO_DATA_DIR:-/data/mongo}:/data/db
    networks:
      - internal
