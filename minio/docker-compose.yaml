name: ${MINIO_PROJECT_NAME:-shared-minio}

networks:
  internal:
    name: ${MINIO_NETWORK:-shared_minio}
    external: true
  proxy:
    name: ${PROXY_NETWORK:-shared_proxy}
    external: true

services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    env_file:
      - ./.env.minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    volumes:
      - ${MINIO_DATA_DIR:-/data/minio}:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - internal
      - proxy
